paths:
  /admin/contact-us:
    get:
      tags:
        - "ContactUs"
      summary: "Get list of contact requests"
      description: "Retrieve a paginated list of contact us inquiries for the admin. Search by first name, last name, email, phone, or message."
      operationId: "listContactRequests"
      produces:
        - "application/json"
      parameters:
        - name: start
          in: query
          description: "Starting index for pagination"
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          description: "Number of items per page"
          required: false
          schema:
            type: integer
            default: 10
        - name: search
          in: query
          description: "Search in names, email, phone, or message"
          required: false
          schema:
            type: string
        - name: orderBy
          in: query
          description: "Field to order by"
          required: false
          schema:
            type: string
            enum: [firstName, lastName, email, createdAt]
            default: createdAt
        - name: orderDirection
          in: query
          description: "Order direction"
          required: false
          schema:
            type: string
            enum: [ASC, DESC, asc, desc]
            default: DESC
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Contact requests retrieved successfully"
        "400":
          description: "Invalid request parameters"
        "401":
          description: "Unauthorized - Invalid or missing token"
        "403":
          description: "Forbidden - Not authorized to perform this action"
        "500":
          description: "Internal server error"
