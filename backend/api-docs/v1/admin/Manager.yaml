paths:
  /admin/manager:
    get:
      tags:
        - "Admin"
      summary: "Retrieve a list of Managers"
      description: "Fetch a paginated list of Managers with optional filters."
      operationId: "getAdmin"
      produces:
        - "application/json"
      parameters:
        - in: "query"
          name: "search"
          schema:
            type: string
          description: "Search term to filter Managers by name or email."
        - in: "query"
          name: "start"
          schema:
            type: integer
            default: 0
          description: "Pagination start index. Default is 0."
        - in: "query"
          name: "limit"
          schema:
            type: integer
            default: 10
          description: "Number of records to fetch. Default is 10."
        - in: "query"
          name: "status"
          schema:
            type: string
            enum: ['active', 'inactive']
          description: "Filter Managers by status ('active' or 'inactive')."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "List of Managers retrieved successfully."
        "400":
          description: "Invalid request parameters."
        "500":
          description: "Internal server error."
    post:
      tags:
        - "Admin"
      summary: "Create a new Manager"
      description: "Add a new Manager with the provided details."
      operationId: "createAdmin"
      requestBody:
        description: "Payload containing Manager details."
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/createAdmin"
        required: true
      produces:
        - "application/json"
      parameters: []
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Manager created successfully."
        "400":
          description: "Invalid request payload."
        "500":
          description: "Internal server error."
  /admin/manager/{id}:
    get:
      tags:
        - "Admin"
      summary: "Retrieve Manager by ID"
      description: "Fetch details of a specific Manager using their ID."
      operationId: "getAdminById"
      produces:
        - "application/json"
      parameters:
        - in: "path"
          name: "id"
          schema:
            type: string
          required: true
          description: "Unique identifier of the Manager."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Manager details retrieved successfully."
        "400":
          description: "Invalid Manager ID."
        "500":
          description: "Internal server error."
    put:
      tags:
        - "Admin"
      summary: "Update Manager details"
      description: "Modify the details of an existing Manager."
      operationId: "putUpdateAdmin"
      requestBody:
        description: "Payload containing updated Manager details."
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/updateAdmin"
        required: true
      produces:
        - "application/json"
      parameters:
        - in: "path"
          name: "id"
          schema:
            type: string
          required: true
          description: "Unique identifier of the Manager."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Manager updated successfully."
        "400":
          description: "Invalid request payload or Manager ID."
        "500":
          description: "Internal server error."
    delete:
      tags:
        - "Admin"
      summary: "Delete a Manager"
      description: "Remove a Manager from the system using their ID."
      operationId: "deleteAdmin"
      produces:
        - "application/json"
      parameters:
        - in: "path"
          name: "id"
          schema:
            type: string
          required: true
          description: "Unique identifier of the Manager."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Manager deleted successfully."
        "400":
          description: "Invalid Manager ID."
        "500":
          description: "Internal server error."
    patch:
      tags:
        - "Admin"
      summary: "Update Manager status"
      description: "Change the status of a Manager (e.g., active or inactive)."
      operationId: "patchAdminStatus"
      produces:
        - "application/json"
      parameters:
        - in: "path"
          name: "id"
          schema:
            type: string
          required: true
          description: "Unique identifier of the Manager."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Manager status updated successfully."
        "400":
          description: "Invalid Manager ID."
        "500":
          description: "Internal server error."

components:
  schemas:
    createAdmin:
      type: object
      properties:
        firstName:
          type: string
          description: "Enter the first name of the Manager."
        lastName:
          type: string
          description: "Enter the last name of the Manager."
        email:
          type: string
          description: "Enter the email address of the Manager."
        mobileNumber:
          type: string
          description: "Enter the mobile number of the Manager."
        profilePicture:
          type: string
          description: "Provide the URL of the Manager's profile picture."
        password:
          type: string
          description: "Set a password for the Manager."
        accessManagement:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
                description: "Specify the category of access."
              canView:
                type: boolean
                description: "Indicate if the Manager can view this category."
              canAdd:
                type: boolean
                description: "Indicate if the Manager can add to this category."
              canEdit:
                type: boolean
                description: "Indicate if the Manager can edit this category."
              canDelete:
                type: boolean
                description: "Indicate if the Manager can delete from this category."
      required:
        - firstName
        - lastName
        - email
        - password
        - accessManagement