paths:
  /contact-us:
    post:
      tags:
        - "Contact Us"
      summary: "Send a contact us message"
      description: "Submits a contact us form. An email notification is sent to the support team with the user's details and message."
      operationId: "postContactUs"
      requestBody:
        description: Contact us form data
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/contact-us"
      produces:
        - "application/json"
      parameters: []
      responses:
        "200":
          description: "Your message has been sent successfully. We will get back to you soon."
        "400":
          description: "Validation error – one or more fields are invalid or missing"
        "500":
          description: "Internal Server Error"

components:
  schemas:
    contact-us:
      type: object
      required:
        - firstName
        - lastName
        - email
        - mobileNumber
        - message
      properties:
        firstName:
          type: string
          maxLength: 50
          example: "John"
          description: "User's first name"
        lastName:
          type: string
          maxLength: 50
          example: "Doe"
          description: "User's last name"
        email:
          type: string
          format: email
          example: "john@example.com"
          description: "User's email address"
        mobileNumber:
          type: string
          example: "+1 (555) 000-0000"
          description: "User's mobile/phone number"
        message:
          type: string
          minLength: 10
          maxLength: 1000
          example: "Tell us how we can help..."
          description: "Message from the user (10–1000 characters)"
